<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper AI Solver</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #111827;
      color: #f9fafb;
      padding: 16px;
      min-height: 100vh;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #f9fafb;
      margin-bottom: 16px;
      letter-spacing: -0.3px;
    }

    .shortcut-bar {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 12px;
      color: #9ca3af;
    }

    /* AI Panel */
    .ai-panel {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .ai-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .ai-icon.safe { background: #052e16; }
    .ai-icon.flag { background: #450a0a; }
    .ai-icon.thinking { background: #1e3a5f; animation: pulse 1.2s infinite; }
    .ai-icon.idle { background: #1f2937; border: 1px solid #374151; }
    .ai-icon.paused { background: #2d1a00; border: 1px solid #92400e; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .ai-text-block { flex: 1; }

    .ai-label {
      font-size: 11px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .ai-move {
      font-size: 16px;
      font-weight: 600;
      color: #f9fafb;
      line-height: 1.3;
    }

    .ai-reason {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }

    .ai-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      flex-shrink: 0;
    }

    .badge-safe { background: #052e16; color: #86efac; }
    .badge-flag { background: #450a0a; color: #fca5a5; }
    .badge-multi { background: #1e3a5f; color: #93c5fd; }
    .badge-idle { background: #1f2937; color: #6b7280; border: 1px solid #374151; }
    .badge-paused { background: #451a03; color: #fdba74; border: 1px solid #92400e; }

    /* Pause Hint Toggle */
    .pause-hint-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
      letter-spacing: 0.3px;
      border: 1.5px solid;
      user-select: none;
    }

    .pause-hint-btn.active {
      background: #052e16;
      border-color: #166534;
      color: #86efac;
    }

    .pause-hint-btn.active:hover {
      background: #064e23;
    }

    .pause-hint-btn.paused {
      background: #450a0a;
      border-color: #7f1d1d;
      color: #fca5a5;
    }

    .pause-hint-btn.paused:hover {
      background: #6b1111;
    }

    .pause-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.18s;
    }

    .pause-hint-btn.active .pause-dot { background: #22c55e; }
    .pause-hint-btn.paused .pause-dot { background: #ef4444; }

    /* Pause overlay on AI panel */
    .ai-panel.paused-state {
      border-color: #7f1d1d;
      opacity: 0.75;
    }

    /* Level Select */
    #level-select { display: grid; gap: 10px; }
    #level-select h2 { font-size: 16px; font-weight: 500; color: #d1d5db; margin-bottom: 6px; }

    .level-btn {
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #374151;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
      background: #1f2937;
    }

    .level-btn:hover { border-color: #4b5563; background: #263344; transform: translateY(-1px); }
    .level-btn p:first-child { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .level-btn p:last-child { font-size: 12px; opacity: 0.6; }
    .level-btn.beginner p:first-child { color: #86efac; }
    .level-btn.intermediate p:first-child { color: #93c5fd; }
    .level-btn.expert p:first-child { color: #fca5a5; }
    .level-btn.custom p:first-child { color: #fde68a; }

    /* Custom Setup */
    #custom-setup { display: none; }
    #custom-setup h2 { font-size: 16px; font-weight: 500; color: #d1d5db; margin-bottom: 14px; }
    .custom-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .input-group { display: flex; flex-direction: column; }
    .input-group label { font-size: 12px; color: #6b7280; margin-bottom: 5px; }
    .input-group input {
      padding: 8px 10px;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 6px;
      font-size: 14px;
      color: #f9fafb;
    }
    .input-group input:focus { outline: none; border-color: #3b82f6; }

    /* Game Board */
    #game-board { display: none; }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1f2937;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 14px;
      border: 1px solid #374151;
    }

    .game-header-left p { margin: 0; font-size: 12px; color: #6b7280; }
    .game-header-left p span { font-weight: 600; color: #d1d5db; }
    .game-header-left p:nth-child(2) { margin-top: 4px; }

    /* Grid */
    #grid {
      display: grid;
      gap: 3px;
      padding: 10px;
      background: #1a2233;
      border-radius: 8px;
      border: 1px solid #374151;
      width: fit-content;
      max-width: 100%;
      margin-bottom: 16px;
      overflow-x: auto;
    }

    .cell {
      width: 28px;
      height: 28px;
      padding: 0;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #374151;
      background: #1f2937;
      border-radius: 4px;
      font-weight: 700;
      color: #6b7280;
      transition: background 0.1s, border-color 0.1s, transform 0.1s;
      position: relative;
      overflow: hidden;
    }

    .cell:hover { background: #263344; border-color: #4b5563; }
    .cell:active { transform: scale(0.93); }
    .cell.selected { border-color: #3b82f6 !important; border-width: 2px !important; box-shadow: 0 0 0 1px #3b82f6; }

    /* Cell states */
    .cell.revealed-empty { background: #0f1a0f; border-color: #1a3a1a; color: #4ade80; }
    .cell.revealed-mine { background: #2a0a0a; border-color: #7f1d1d; }
    .cell.num-1 { background: #1a2a3a; border-color: #1e3a8a; color: #60a5fa; }
    .cell.num-2 { background: #0f2a1a; border-color: #166534; color: #4ade80; }
    .cell.num-3 { background: #2a1a1a; border-color: #991b1b; color: #f87171; }
    .cell.num-4 { background: #1a1530; border-color: #312e81; color: #a78bfa; }
    .cell.num-5 { background: #2a1510; border-color: #9a3412; color: #fb923c; }
    .cell.num-6 { background: #0a2020; border-color: #134e4a; color: #2dd4bf; }
    .cell.num-7 { background: #201a28; border-color: #4a1d96; color: #c4b5fd; }
    .cell.num-8 { background: #252025; border-color: #581c87; color: #e879f9; }

    /* AI highlight animations */
    @keyframes flagPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.6); background: rgba(127,29,29,0.5); }
      50% { box-shadow: 0 0 0 6px rgba(239,68,68,0); background: rgba(185,28,28,0.6); }
    }

    @keyframes safePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.6); background: rgba(5,46,22,0.7); }
      50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); background: rgba(20,83,45,0.7); }
    }

    .ai-hint-flag {
      animation: flagPulse 1.2s ease-in-out infinite;
      border-color: #ef4444 !important;
      border-width: 2px !important;
    }

    .ai-hint-safe {
      animation: safePulse 1.2s ease-in-out infinite;
      border-color: #22c55e !important;
      border-width: 2px !important;
    }

    /* Controls */
    .controls { margin-bottom: 14px; }
    .controls label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 8px; }
    .button-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    button {
      padding: 9px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
    }

    .btn-empty { background: #052e16; border: 1px solid #166534; color: #86efac; }
    .btn-empty:hover { background: #064e23; }
    .btn-number { background: #1f2937; border: 1px solid #374151; color: #d1d5db; }
    .btn-number:hover { background: #263344; }
    .btn-mine { background: #450a0a; border: 1px solid #7f1d1d; color: #fca5a5; }
    .btn-mine:hover { background: #6b1111; }

    #number-section {
      display: none;
      background: #1f2937;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 14px;
      border: 1px solid #374151;
    }

    #number-section label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 10px; }
    .number-buttons { display: flex; gap: 6px; flex-wrap: wrap; }

    .num-btn {
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      border: none;
      color: white;
    }

    .num-btn.n1 { background: #1d4ed8; }
    .num-btn.n2 { background: #16a34a; }
    .num-btn.n3 { background: #dc2626; }
    .num-btn.n4 { background: #1e3a8a; }
    .num-btn.n5 { background: #9a3412; }
    .num-btn.n6 { background: #0f766e; }
    .num-btn.n7 { background: #4c1d95; }
    .num-btn.n8 { background: #9d174d; }

    #selected-info {
      display: none;
      padding: 10px 12px;
      background: #1a2233;
      border-radius: 6px;
      margin-bottom: 14px;
      border: 1px solid #374151;
      font-size: 12px;
      color: #9ca3af;
    }

    .btn-group { display: grid; grid-template-columns: auto auto; gap: 10px; }
    .btn-back { background: #1f2937; border: 1px solid #374151; color: #d1d5db; }
    .btn-back:hover { background: #263344; }
    .btn-start { background: #1e3a5f; border: 1px solid #1d4ed8; color: #93c5fd; }
    .btn-start:hover { background: #1e40af; }
    .btn-back-top { background: #1f2937; border: 1px solid #374151; color: #9ca3af; font-size: 12px; padding: 7px 12px; }
    .btn-back-top:hover { background: #263344; }
    .btn-clear { width: 100%; background: #1f2937; border: 1px solid #374151; color: #6b7280; margin-bottom: 14px; }
    .btn-clear:hover { background: #263344; }

    /* Stats */
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .stat-card {
      background: #1f2937;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #374151;
      text-align: center;
    }
    .stat-card p:first-child { font-size: 11px; color: #6b7280; margin: 0; }
    .stat-card p:last-child { font-size: 22px; font-weight: 700; color: #f9fafb; margin: 4px 0 0; }

    /* Multi-hint list */
    .hint-list {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }

    .hint-list-title { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .hint-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-top: 1px solid #1f2937;
      font-size: 13px;
    }
    .hint-item:first-of-type { border-top: none; }
    .hint-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-flag { background: #ef4444; }
    .dot-safe { background: #22c55e; }

    /* Paused hint list */
    .hint-list.paused-list {
      opacity: 0.4;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h1>⛏️ Minesweeper AI Solver</h1>

  <div class="shortcut-bar">
    Right-click = Flag &nbsp;|&nbsp; Space = Empty &nbsp;|&nbsp; 1–8 = Number &nbsp;|&nbsp; Ctrl+Click = Multi-select
  </div>

  <!-- AI Panel -->
  <div class="ai-panel" id="ai-panel">
    <div class="ai-icon idle" id="ai-icon">🤖</div>
    <div class="ai-text-block">
      <div class="ai-label">AI Suggestion</div>
      <div class="ai-move" id="ai-move">Select a level to begin</div>
      <div class="ai-reason" id="ai-reason"></div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;">
      <div class="ai-badge badge-idle" id="ai-badge">IDLE</div>
      <button class="pause-hint-btn active" id="pause-btn" onclick="togglePause()" title="Toggle AI hints on/off">
        <span class="pause-dot"></span>
        <span id="pause-label">Hints ON</span>
      </button>
    </div>
  </div>

  <div id="game-screen">
    <!-- Level Selection -->
    <div id="level-select">
      <h2>Choose Difficulty</h2>
      <button class="level-btn beginner" onclick="selectLevel('beginner')">
        <p>Beginner</p>
        <p>9×9 grid · 10 mines</p>
      </button>
      <button class="level-btn intermediate" onclick="selectLevel('intermediate')">
        <p>Intermediate</p>
        <p>16×16 grid · 40 mines</p>
      </button>
      <button class="level-btn expert" onclick="selectLevel('expert')">
        <p>Expert</p>
        <p>30×16 grid · 99 mines</p>
      </button>
      <button class="level-btn custom" onclick="selectLevel('custom')">
        <p>Custom</p>
        <p>Choose your own size & mines</p>
      </button>
    </div>

    <!-- Custom Setup -->
    <div id="custom-setup">
      <h2>Custom Game Setup</h2>
      <div class="custom-inputs">
        <div class="input-group">
          <label>Rows</label>
          <input type="number" id="custom-rows" value="10" min="3" max="30">
        </div>
        <div class="input-group">
          <label>Columns</label>
          <input type="number" id="custom-cols" value="10" min="3" max="30">
        </div>
      </div>
      <div class="input-group" style="margin-bottom: 14px;">
        <label>Mine Count</label>
        <input type="number" id="custom-mines" value="10" min="1">
      </div>
      <div class="btn-group">
        <button class="btn-back" onclick="backToLevels()">← Back</button>
        <button class="btn-start" onclick="startCustomGame()">Start Game</button>
      </div>
    </div>

    <!-- Game Board -->
    <div id="game-board">
      <div class="game-header">
        <div class="game-header-left">
          <p>Level: <span id="level-name">Expert</span></p>
          <p>Board: <span id="board-size">30×16</span> · Mines: <span id="mine-count">99</span></p>
        </div>
        <div class="btn-group">
          <button class="btn-back-top" onclick="backToLevels()">← Change Level</button>
        </div>
      </div>

      <div id="grid"></div>

      <div id="selected-info">
        <span id="cell-coords"></span>
      </div>

      <div class="controls">
        <label>Apply to selected cells:</label>
        <div class="button-grid">
          <button class="btn-empty" onclick="revealCell('empty')">⬜ Empty</button>
          <button class="btn-number" onclick="revealCell('number')">🔢 Number</button>
          <button class="btn-mine" onclick="revealCell('mine')">🚩 Flag</button>
        </div>
      </div>

      <div id="number-section">
        <label>Adjacent mines:</label>
        <div class="number-buttons">
          <button class="num-btn n1" onclick="selectNumber(1)">1</button>
          <button class="num-btn n2" onclick="selectNumber(2)">2</button>
          <button class="num-btn n3" onclick="selectNumber(3)">3</button>
          <button class="num-btn n4" onclick="selectNumber(4)">4</button>
          <button class="num-btn n5" onclick="selectNumber(5)">5</button>
          <button class="num-btn n6" onclick="selectNumber(6)">6</button>
          <button class="num-btn n7" onclick="selectNumber(7)">7</button>
          <button class="num-btn n8" onclick="selectNumber(8)">8</button>
        </div>
      </div>

      <button class="btn-clear" onclick="clearSelection()">Clear Selection</button>

      <div class="hint-list" id="hint-list" style="display:none"></div>

      <div class="stats">
        <div class="stat-card">
          <p>Opened</p>
          <p id="stat-opened">0</p>
        </div>
        <div class="stat-card">
          <p>Flagged</p>
          <p id="stat-flagged">0</p>
        </div>
        <div class="stat-card">
          <p>Hidden</p>
          <p id="stat-hidden">0</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const numColors = {
      '1': 'num-1', '2': 'num-2', '3': 'num-3', '4': 'num-4',
      '5': 'num-5', '6': 'num-6', '7': 'num-7', '8': 'num-8'
    };

    const levels = {
      beginner: { rows: 9, cols: 9, mines: 10, name: 'Beginner' },
      intermediate: { rows: 16, cols: 16, mines: 40, name: 'Intermediate' },
      expert: { rows: 16, cols: 30, mines: 99, name: 'Expert' },
      custom: { rows: 10, cols: 10, mines: 10, name: 'Custom' }
    };

    let selectedCells = new Set();
    let board = [];
    let rows = 16, cols = 30, mineCount = 99;
    let currentLevel = 'expert';
    let lastSelectedCell = null;
    let currentHints = [];
    let hintsPaused = false;

    /* ── Pause Toggle ── */
    function togglePause() {
      hintsPaused = !hintsPaused;
      const btn = document.getElementById('pause-btn');
      const label = document.getElementById('pause-label');
      const panel = document.getElementById('ai-panel');
      const hintList = document.getElementById('hint-list');

      if (hintsPaused) {
        btn.className = 'pause-hint-btn paused';
        label.textContent = 'Hints OFF';
        panel.classList.add('paused-state');
        hintList.classList.add('paused-list');
        clearHintAnimations();
        setAI('paused', 'Hints paused', 'Toggle the button to resume AI suggestions', 'PAUSED');
      } else {
        btn.className = 'pause-hint-btn active';
        label.textContent = 'Hints ON';
        panel.classList.remove('paused-state');
        hintList.classList.remove('paused-list');
        analyze();
      }
    }

    function selectLevel(level) {
      if (level === 'custom') {
        document.getElementById('level-select').style.display = 'none';
        document.getElementById('custom-setup').style.display = 'block';
      } else {
        startGame(level);
      }
    }

    function backToLevels() {
      document.getElementById('game-board').style.display = 'none';
      document.getElementById('custom-setup').style.display = 'none';
      document.getElementById('level-select').style.display = 'grid';
      selectedCells.clear();
      currentHints = [];
      setAI('idle', 'Select a level to begin', '', 'IDLE');
    }

    function startCustomGame() {
      const r = parseInt(document.getElementById('custom-rows').value);
      const c = parseInt(document.getElementById('custom-cols').value);
      const m = parseInt(document.getElementById('custom-mines').value);
      if (m >= r * c) { alert('Too many mines!'); return; }
      rows = r; cols = c; mineCount = m; currentLevel = 'custom';
      document.getElementById('custom-setup').style.display = 'none';
      initGame();
    }

    function startGame(level) {
      const d = levels[level];
      rows = d.rows; cols = d.cols; mineCount = d.mines; currentLevel = level;
      document.getElementById('level-select').style.display = 'none';
      initGame();
    }

    function initGame() {
      board = Array(rows).fill(null).map(() => Array(cols).fill(null));
      selectedCells.clear();
      lastSelectedCell = null;
      currentHints = [];

      document.getElementById('level-name').textContent = levels[currentLevel].name;
      document.getElementById('board-size').textContent = `${rows}×${cols}`;
      document.getElementById('mine-count').textContent = mineCount;
      document.getElementById('game-board').style.display = 'block';

      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      grid.style.gridTemplateColumns = `repeat(${cols}, 28px)`;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = document.createElement('button');
          cell.className = 'cell';
          cell.textContent = '?';
          cell.onclick = (e) => toggleCell(r, c, cell, e);
          cell.oncontextmenu = (e) => { e.preventDefault(); handleRightClick(r, c, cell); };
          cell.id = `cell-${r}-${c}`;
          grid.appendChild(cell);
        }
      }

      updateStats();

      if (hintsPaused) {
        setAI('paused', 'Hints paused', 'Toggle the button to resume AI suggestions', 'PAUSED');
      } else {
        setAI('idle', 'Click a cell to start entering board state', '', 'IDLE');
      }
    }

    function setAI(mode, move, reason, badge) {
      const icon = document.getElementById('ai-icon');
      const moveEl = document.getElementById('ai-move');
      const reasonEl = document.getElementById('ai-reason');
      const badgeEl = document.getElementById('ai-badge');

      moveEl.textContent = move;
      reasonEl.textContent = reason;
      badgeEl.textContent = badge;
      badgeEl.className = 'ai-badge';
      icon.className = 'ai-icon';

      if (mode === 'safe') {
        icon.textContent = '✅';
        icon.classList.add('safe');
        badgeEl.classList.add('badge-safe');
      } else if (mode === 'flag') {
        icon.textContent = '🚩';
        icon.classList.add('flag');
        badgeEl.classList.add('badge-flag');
      } else if (mode === 'multi') {
        icon.textContent = '🧠';
        icon.classList.add('thinking');
        badgeEl.classList.add('badge-multi');
      } else if (mode === 'paused') {
        icon.textContent = '⏸️';
        icon.classList.add('paused');
        badgeEl.classList.add('badge-paused');
      } else {
        icon.textContent = '🤖';
        icon.classList.add('idle');
        badgeEl.classList.add('badge-idle');
      }
    }

    function toggleCell(r, c, element, event) {
      const key = `${r},${c}`;
      lastSelectedCell = { r, c, element };

      if (event.ctrlKey || event.metaKey) {
        if (selectedCells.has(key)) {
          selectedCells.delete(key);
          element.classList.remove('selected');
        } else {
          selectedCells.add(key);
          element.classList.add('selected');
        }
      } else {
        clearSelectionUI();
        selectedCells.add(key);
        element.classList.add('selected');
      }
      updateSelectedInfo();
    }

    function handleRightClick(r, c, element) {
      clearSelectionUI();
      selectedCells.add(`${r},${c}`);
      lastSelectedCell = { r, c, element };
      revealCell('mine');
    }

    function updateSelectedInfo() {
      const info = document.getElementById('selected-info');
      const coords = document.getElementById('cell-coords');
      if (selectedCells.size === 0) { info.style.display = 'none'; return; }
      if (selectedCells.size === 1) {
        const [k] = selectedCells;
        const [r, c] = k.split(',');
        coords.textContent = `Selected: Row ${+r + 1}, Col ${+c + 1}`;
      } else {
        coords.textContent = `${selectedCells.size} cells selected`;
      }
      info.style.display = 'block';
    }

    function revealCell(type) {
      const cells = selectedCells.size > 0 ? selectedCells
        : lastSelectedCell ? new Set([`${lastSelectedCell.r},${lastSelectedCell.c}`]) : new Set();
      if (cells.size === 0) { alert('Select a cell first!'); return; }

      if (type === 'number') { document.getElementById('number-section').style.display = 'block'; return; }

      for (const key of cells) {
        const [r, c] = key.split(',').map(Number);
        const el = document.getElementById(`cell-${r}-${c}`);
        if (type === 'mine') {
          board[r][c] = 'M';
          el.textContent = '🚩';
          el.className = 'cell revealed-mine';
        } else {
          board[r][c] = '0';
          el.textContent = '';
          el.className = 'cell revealed-empty';
        }
      }
      clearSelectionUI();
      analyze();
    }

    function selectNumber(num) {
      const cells = selectedCells.size > 0 ? selectedCells
        : lastSelectedCell ? new Set([`${lastSelectedCell.r},${lastSelectedCell.c}`]) : new Set();
      for (const key of cells) {
        const [r, c] = key.split(',').map(Number);
        const el = document.getElementById(`cell-${r}-${c}`);
        board[r][c] = num.toString();
        el.textContent = num.toString();
        el.className = `cell ${numColors[num.toString()]}`;
      }
      document.getElementById('number-section').style.display = 'none';
      clearSelectionUI();
      analyze();
    }

    function clearSelectionUI() {
      selectedCells.clear();
      document.querySelectorAll('[id^="cell-"]').forEach(b => b.classList.remove('selected'));
      document.getElementById('selected-info').style.display = 'none';
    }

    function clearSelection() {
      clearSelectionUI();
      document.getElementById('number-section').style.display = 'none';
    }

    function getNeighbors(r, c) {
      const n = [];
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && !(dr === 0 && dc === 0)) {
            n.push({ r: nr, c: nc });
          }
        }
      }
      return n;
    }

    function clearHintAnimations() {
      document.querySelectorAll('.ai-hint-flag, .ai-hint-safe').forEach(el => {
        el.classList.remove('ai-hint-flag', 'ai-hint-safe');
      });
    }

    function analyze() {
      updateStats();

      /* If hints are paused, just clear animations and leave paused state */
      if (hintsPaused) {
        clearHintAnimations();
        return;
      }

      clearHintAnimations();

      const safeMoves = new Map();
      const flagMoves = new Map();

      // Pass 1: basic constraint logic
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const val = board[r][c];
          if (!val || val === 'M' || val === '0') continue;
          const num = parseInt(val);
          const neighbors = getNeighbors(r, c);

          const unrevealed = neighbors.filter(n => board[n.r][n.c] === null);
          const flagged = neighbors.filter(n => board[n.r][n.c] === 'M').length;
          const remaining = num - flagged;

          if (remaining === 0 && unrevealed.length > 0) {
            for (const n of unrevealed) {
              const k = `${n.r},${n.c}`;
              if (!safeMoves.has(k)) safeMoves.set(k, `Adjacent to ${val} at (${r+1},${c+1}) – all mines flagged`);
            }
          }

          if (remaining > 0 && unrevealed.length === remaining) {
            for (const n of unrevealed) {
              const k = `${n.r},${n.c}`;
              if (!flagMoves.has(k)) flagMoves.set(k, `${val} at (${r+1},${c+1}) needs ${remaining} more mine${remaining>1?'s':''} in ${unrevealed.length} cell${unrevealed.length>1?'s':''}`);
            }
          }
        }
      }

      // Pass 2: subset logic (advanced)
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const val = board[r][c];
          if (!val || val === 'M' || val === '0') continue;
          const numA = parseInt(val);
          const nbrsA = getNeighbors(r, c);
          const unrevA = nbrsA.filter(n => board[n.r][n.c] === null);
          const flaggedA = nbrsA.filter(n => board[n.r][n.c] === 'M').length;
          const remA = numA - flaggedA;

          for (let dr = -2; dr <= 2; dr++) {
            for (let dc = -2; dc <= 2; dc++) {
              if (dr === 0 && dc === 0) continue;
              const r2 = r + dr, c2 = c + dc;
              if (r2 < 0 || r2 >= rows || c2 < 0 || c2 >= cols) continue;
              const val2 = board[r2][c2];
              if (!val2 || val2 === 'M' || val2 === '0') continue;
              const numB = parseInt(val2);
              const nbrsB = getNeighbors(r2, c2);
              const unrevB = nbrsB.filter(n => board[n.r][n.c] === null);
              const flaggedB = nbrsB.filter(n => board[n.r][n.c] === 'M').length;
              const remB = numB - flaggedB;

              const setA = new Set(unrevA.map(n => `${n.r},${n.c}`));
              const setB = new Set(unrevB.map(n => `${n.r},${n.c}`));

              const bInA = [...setB].every(k => setA.has(k));
              if (bInA && setB.size > 0 && setA.size > setB.size) {
                const diff = [...setA].filter(k => !setB.has(k));
                const diffMines = remA - remB;
                if (diffMines === 0) {
                  for (const k of diff) {
                    if (!safeMoves.has(k)) {
                      safeMoves.set(k, `Subset: mines of ${val} at (${r+1},${c+1}) are contained by ${val2} at (${r2+1},${c2+1})`);
                    }
                  }
                } else if (diffMines === diff.length && diffMines > 0) {
                  for (const k of diff) {
                    if (!flagMoves.has(k)) {
                      flagMoves.set(k, `Subset: ${diffMines} mine${diffMines>1?'s':''} must be in remaining cells`);
                    }
                  }
                }
              }
            }
          }
        }
      }

      for (const k of flagMoves.keys()) safeMoves.delete(k);

      const hintList = document.getElementById('hint-list');
      currentHints = [];

      if (flagMoves.size === 0 && safeMoves.size === 0) {
        setAI('idle', 'Keep revealing cells to find patterns', 'Not enough info yet — open more cells', 'WAITING');
        hintList.style.display = 'none';
        return;
      }

      let firstFlag = null;
      for (const [k, reason] of flagMoves) {
        const [r, c] = k.split(',').map(Number);
        const el = document.getElementById(`cell-${r}-${c}`);
        if (el) el.classList.add('ai-hint-flag');
        currentHints.push({ type: 'flag', r, c, reason });
        if (!firstFlag) firstFlag = { r, c, reason };
      }
      for (const [k, reason] of safeMoves) {
        const [r, c] = k.split(',').map(Number);
        const el = document.getElementById(`cell-${r}-${c}`);
        if (el) el.classList.add('ai-hint-safe');
        currentHints.push({ type: 'safe', r, c, reason });
      }

      const total = flagMoves.size + safeMoves.size;
      if (total > 0) {
        hintList.style.display = 'block';
        let html = `<div class="hint-list-title">All current hints (${total})</div>`;
        for (const [k, reason] of flagMoves) {
          const [r, c] = k.split(',').map(Number);
          html += `<div class="hint-item"><div class="hint-dot dot-flag"></div><span style="color:#fca5a5;font-weight:600">Flag</span>&nbsp;Row ${r+1}, Col ${c+1}</div>`;
        }
        for (const [k, reason] of safeMoves) {
          const [r, c] = k.split(',').map(Number);
          html += `<div class="hint-item"><div class="hint-dot dot-safe"></div><span style="color:#86efac;font-weight:600">Open</span>&nbsp;Row ${r+1}, Col ${c+1}</div>`;
        }
        hintList.innerHTML = html;
      } else {
        hintList.style.display = 'none';
      }

      if (flagMoves.size > 0 && safeMoves.size > 0) {
        const topFlag = [...flagMoves.entries()][0];
        const [fr, fc] = topFlag[0].split(',').map(Number);
        setAI('multi',
          `Flag Row ${fr+1}, Col ${fc+1} — then open ${safeMoves.size} safe cell${safeMoves.size>1?'s':''}`,
          `${flagMoves.size} mine${flagMoves.size>1?'s':''} found · ${safeMoves.size} safe cell${safeMoves.size>1?'s':''} — see animated cells`,
          `${total} HINTS`
        );
      } else if (flagMoves.size > 0) {
        const top = [...flagMoves.entries()][0];
        const [fr, fc] = top[0].split(',').map(Number);
        setAI('flag',
          `Flag Row ${fr+1}, Col ${fc+1}`,
          top[1] + (flagMoves.size > 1 ? ` (+${flagMoves.size-1} more flagged)` : ''),
          flagMoves.size > 1 ? `${flagMoves.size} FLAGS` : 'FLAG'
        );
      } else {
        const top = [...safeMoves.entries()][0];
        const [sr, sc] = top[0].split(',').map(Number);
        setAI('safe',
          `Open Row ${sr+1}, Col ${sc+1}`,
          top[1] + (safeMoves.size > 1 ? ` (+${safeMoves.size-1} more safe)` : ''),
          safeMoves.size > 1 ? `${safeMoves.size} SAFE` : 'SAFE'
        );
      }
    }

    function updateStats() {
      let opened = 0, flagged = 0, hidden = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (board[r][c] === 'M') flagged++;
          else if (board[r][c] !== null) opened++;
          else hidden++;
        }
      }
      document.getElementById('stat-opened').textContent = opened;
      document.getElementById('stat-flagged').textContent = flagged;
      document.getElementById('stat-hidden').textContent = hidden;
    }

    document.addEventListener('keydown', (e) => {
      if (!lastSelectedCell && selectedCells.size === 0) return;
      if (e.code === 'Space') {
        e.preventDefault();
        revealCell('empty');
      } else if (e.code >= 'Digit1' && e.code <= 'Digit8') {
        e.preventDefault();
        selectNumber(parseInt(e.code.replace('Digit', '')));
      }
    });

    startGame('expert');
  </script>
</body>
</html>
